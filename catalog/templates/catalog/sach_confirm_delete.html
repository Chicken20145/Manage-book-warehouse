<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận xóa sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-danger">
                    <div class="card-header bg-danger text-white text-center">
                        <h4>⚠️ Cảnh Báo Xóa Dữ Liệu</h4>
                    </div>
                    <div class="card-body text-center p-4">
                        <p class="fs-5">Bạn có chắc chắn muốn xóa cuốn sách <br><strong class="text-danger">"{{ object.tieu_de }}"</strong> không?</p>
                        <p class="text-muted small">Hành động này không thể hoàn tác.</p>
                        
                        <form method="POST">
                            {% csrf_token %}
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-danger fw-bold">❌ Xác Nhận Xóa</button>
                                <a href="{% url 'danh-sach-sach' %}" class="btn btn-secondary">Hủy bỏ</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
